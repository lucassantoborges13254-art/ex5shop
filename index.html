<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ex5store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 24px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }
    .product {
      background: white;
      padding: 20px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .product h2 {
      margin: 0 0 10px;
    }
    .btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  ex5store – Produtos Hotmart
</header>

<div class="container">

  <div class="product">
    <h2>Produto 1</h2>
    <p>Descrição rápida do produto…</p>
    <a class="btn" href="#" target="_blank">Comprar</a>
  </div>

  <div class="product">
    <h2>Produto 2</h2>
    <p>Descrição rápida do produto…</p>
    <a class="btn" href="#" target="_blank">Comprar</a>
  </div>

  <div class="product">

    <p>Descrição rápida do produto…</p>
    <a class="btn" href="#" target="_blank">Comprar</a>

</div>

</body>
</html>
